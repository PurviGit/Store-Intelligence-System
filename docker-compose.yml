version: "3.9"

# API image: FastAPI + SQLite only (no PyTorch/OpenCV) — builds in ~60s.
# Pipeline image: YOLOv8n + OpenCV — run separately when processing CCTV clips.
# See: STORE1_DIR="..." STORE2_DIR="..." bash pipeline/run.sh

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:8000"
    environment:
      # DB stored inside the bind-mounted data/ dir — always fresh on rebuild
      - DATABASE_URL=sqlite:////app/data/store_intelligence.db
      - POS_FILE=/app/data/pos_transactions.csv
    volumes:
      - ./data:/app/data      # events.jsonl, pos_transactions.csv, store_layout.json, DB
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
